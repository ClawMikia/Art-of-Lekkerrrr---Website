<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Trophy Room - Art of Lekkerrrr</title>
    <link rel="icon" type="image/png" href="assets/app_icon.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="card hero tr">
        <button class="back" id="back" aria-label="Back">&#8592;</button>
        <h1>Trophy Room</h1>
        <button class="link" id="help" aria-label="Shortcuts">Shortcuts ?</button
        ><button class="link" id="rp" style="margin-left: 12px">Reset progress</button>
      </header>
      <div class="tcols">
        <aside class="tside">
          <div class="card tc">
            <div
              class="badge"
              id="lv"
              style="width: 60px; height: 60px; font-size: 20px"
            ></div>
            <div class="grow">
              <div class="rank" id="rank"></div>
              <div class="bar" style="height: 8px"><i id="xpb"></i></div>
              <small id="xpt"></small>
            </div>
          </div>
          <nav class="card tabs" id="tabs"></nav>
          <div class="card">
            <div class="seg" id="seg">
              <button class="btn out" data-fl="all">All</button
              ><button class="btn out" data-fl="unlocked">Unlocked</button
              ><button class="btn out" data-fl="locked">Locked</button>
            </div>
            <input
              id="q"
              type="text"
              placeholder="Search rewards"
              autocomplete="off"
              aria-label="Search rewards"
            />
          </div>
        </aside>
        <main>
          <p
            id="empty"
            class="card"
            style="text-align: center; color: var(--th)"
            hidden
          >
            Nothing here yet.
          </p>
          <div class="grid" id="grid"></div>
        </main>
      </div>
    </div>
    <script src="js/rewards-data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/trophy.js"></script>
  </body>
</html>
